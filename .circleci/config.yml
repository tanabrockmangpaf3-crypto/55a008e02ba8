version: 2.1

jobs:
  start7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compose fixture D
          command: |
            mkdir -p /tmp/med-speed
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1 count=100000 2>/dev/null | od -An -c > /tmp/med-speed/DSC32311; true
            echo "snapshot taken: $(wc -c </tmp/med-speed/DSC32311) B / $(wc -l </tmp/med-speed/DSC32311) lines"
      - persist_to_workspace:
          root: /tmp/med-speed
          paths:
            - 'DSC32311'
  titan-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/med-speed
      - run:
          name: Draw in handoff
          command: |
            cat /tmp/med-speed/FTP.SDK 2>/dev/null | sha256sum | cut -c1-32 | fold -w 8 | tr '\n' '-' || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack build archive
          command: zcat build-deps-release.tgz | tar xvf -
      - run:
          command: uptime
      - run:
          command: "./start-01"
  INTERFACE:
    docker:
      - image: cimg/base:current
